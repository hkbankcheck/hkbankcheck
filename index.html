<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港銀行比較 2025｜定期存款・外幣兌換・服務收費（按戶口類別）</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="logo" id="h1Title"><img src="/logo.png" alt="Logo" class="logo-mark" style="height:30px; width:auto; object-fit:contain;"><span class="logo-full">香港銀行一站式比較</span><span class="logo-short">銀行比較</span>
    <div class="bar-side">
      <div class="updated" id="updatedWrap"><span id="updatedLabel">最後更新：</span><strong id="lastUpdated">—</strong></div>
      <div class="langsw" id="langsw"></div>
    </div>
  </div>
</header>
<div class="wrap subhead">
  <nav class="nav">
    <button class="active" data-page="td" id="navTdBtn">📈 定期存款利率</button>
    <button data-page="fx" id="navFxBtn">💱 外幣兌換</button>
    <button data-page="fees" id="navFeesBtn">💳 服務收費</button>
  </nav>
  <p id="pSubtitle" class="lede">16 間傳統及虛擬銀行 · 每間銀行可自選戶口類別 · 定期存款利率 · 外幣兌換匯率 · 服務收費</p>
</div>

<main class="wrap">

<!-- ============ 定期存款 ============ -->
<section class="page active" id="page-td">
  <div class="filter-sentinel" aria-hidden="true"></div>
  <div class="filterbar" data-page="td"></div>
  <p class="sub filter-note" id="tdHint"></p>
  <div class="table-wrap"><table><thead><tr id="tdHead"></tr></thead><tbody id="tdBody"></tbody></table></div>
  <div class="notices">
    <div class="notice green tier-notice"></div>
    <div class="notice" id="tdNotice"></div>
  </div>
  <div class="calc"><h3 id="calcTdTitle"></h3>
    <div class="row"><label id="labelAmount"></label><input type="number" id="tdAmt" value="100000" min="1" step="1000" style="width:160px">
      <label id="labelCurrency1"></label><select id="tdCalcCur"><option>HKD</option><option>USD</option><option>CNY</option></select>
      <label id="labelTenor"></label><select id="tdCalcTenor"><option value="m1">1 個月</option><option value="m3" selected>3 個月</option><option value="m6">6 個月</option><option value="m12">12 個月</option></select></div>
    <ul class="rank" id="tdRank"></ul>
    <p class="sub" style="margin-top:12px" id="calcTdNote"></p></div>
</section>

<!-- ============ 外幣兌換 ============ -->
<section class="page" id="page-fx">
  <div class="fxhead">
    <div class="mid"><span id="fxMidLabel"></span><br><b id="fxMid">—</b><div class="status" id="fxStatus">載入中…</div></div>
    <span class="sub" id="fxHint"></span>
  </div>
  <div class="filter-sentinel" aria-hidden="true"></div>
  <div class="filterbar" data-page="fx"></div>
  <div class="table-wrap"><table><thead><tr id="fxHead"></tr></thead><tbody id="fxBody"></tbody></table></div>
  <div class="notices">
    <div class="notice green tier-notice"></div>
    <div class="notice blue" id="fxNotice"></div>
  </div>
  <div class="calc"><h3 id="calcFxTitle"></h3>
    <div class="row"><label id="labelUseHKD"></label><input type="number" id="fxAmt" value="10000" min="1" step="100" style="width:160px"><label id="labelConvertTo"></label><select id="fxCalcCur"></select></div>
    <ul class="rank" id="fxRank"></ul></div>
</section>

<!-- ============ 服務收費 ============ -->
<section class="page" id="page-fees">
  <div class="controls">
    <input type="search" id="search">
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="legend">
    <span><i class="dot" style="background:var(--free)"></i><span id="legendFree"></span></span>
    <span><i class="dot" style="background:var(--cond)"></i><span id="legendCond"></span></span>
    <span><i class="dot" style="background:var(--paid)"></i><span id="legendPaid"></span></span>
    <span><i class="dot" style="background:var(--na)"></i><span id="legendNA"></span></span>
    <span id="legendHover"></span>
  </div>
  <div class="filter-sentinel" aria-hidden="true"></div>
  <div class="filterbar" data-page="fees"></div>
  <div class="table-wrap"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
  <div class="notices">
    <div class="notice green tier-notice"></div>
    <div class="notice" id="feesNotice"></div>
  </div>
  <section class="summary">
    <div class="card"><h3 id="sc1Title"></h3><ul><li id="sc1Li1"></li><li id="sc1Li2"></li><li id="sc1Li3"></li></ul></div>
    <div class="card"><h3 id="sc2Title"></h3><ul><li id="sc2Li1"></li><li id="sc2Li2"></li><li id="sc2Li3"></li></ul></div>
  </section>
</section>
</main>

<!-- 戶口類別下拉選單（全局共用） -->
<div id="tpop"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<footer><p id="footerLine1"></p><p id="footerLine2"></p></footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
